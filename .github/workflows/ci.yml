name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers nutzt den Docker-Daemon, der auf ubuntu-latest bereits laeuft.
      - name: Build und Tests
        run: ./mvnw -B verify
